<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ein Übungsspiel zum Erkennen von Noten im Violin- und Bassschlüssel.">
  <meta name="theme-color" content="#fff7ea">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <title>Welche Note ist das?</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">

    <!-- Startseite -->
    <section id="ansicht-start" class="ansicht ansicht-start" aria-labelledby="titel-start">
      <div class="start-tier" id="start-tier"></div>
      <h1 id="titel-start" class="spieltitel" tabindex="-1">Welche Note ist das?</h1>
      <button type="button" class="knopf knopf-haupt knopf-start" id="knopf-start">Start</button>
      <p class="start-auswahl" id="start-auswahl"></p>
      <!-- Weitere Spielmodi aus js/modi/ erscheinen hier automatisch. -->
      <div class="start-modi" id="start-modi" role="group" aria-label="Mini-Spiele" hidden></div>
      <div class="start-menue">
        <button type="button" class="knopf knopf-neben" id="knopf-tiere">
          <span aria-hidden="true">🐾</span> Meine Tiere
        </button>
        <button type="button" class="knopf knopf-neben" id="knopf-rekorde">
          <span aria-hidden="true">🏆</span> Rekorde
        </button>
        <button type="button" class="knopf knopf-neben" id="knopf-einstellungen">
          <span aria-hidden="true">⚙️</span> Einstellungen
        </button>
      </div>
      <p class="hinweis-speicher" id="hinweis-speicher" hidden>
        Dieser Browser kann den Spielstand nicht speichern. Du kannst trotzdem spielen.
      </p>
    </section>

    <!-- Spielrunde -->
    <section id="ansicht-runde" class="ansicht ansicht-runde" aria-labelledby="titel-runde" hidden>
      <header class="runde-kopf">
        <button type="button" class="knopf knopf-klein knopf-zurueck" aria-label="Zurück zur Startseite">
          <span aria-hidden="true">←</span><span class="knopf-text"> Startseite</span>
        </button>
        <div class="runde-status">
          <span class="sterne-anzeige" id="sterne-anzeige" role="img" aria-label="3 von 3 Sternen"></span>
          <span class="punkte-anzeige" id="punkte-anzeige">0 Punkte</span>
        </div>
      </header>

      <div class="runde-inhalt">
        <div class="runde-noten">
          <p class="aufgabe-nr" id="aufgabe-nr">Aufgabe 1 von 10</p>
          <h1 id="titel-runde" class="frage" tabindex="-1">Welche Note ist das?</h1>
          <div class="notensystem" id="notensystem"></div>
        </div>

        <div class="runde-antworten">
          <div class="tier-zeile">
            <div class="tier-klein" id="runde-tier"></div>
            <div class="sprechblase" id="sprechblase">
              <div aria-live="polite">
                <div class="merkhilfe" id="merkhilfe" hidden>
                  <div class="merkhilfe-bild" id="merkhilfe-bild"></div>
                  <p class="merkhilfe-text" id="merkhilfe-text"></p>
                </div>
                <p id="sprechblase-text"></p>
              </div>
              <button type="button" class="knopf knopf-haupt knopf-weiter" id="knopf-weiter" hidden>Weiter</button>
            </div>
          </div>
          <div class="antworten" id="antworten" role="group" aria-label="Antworten"></div>
        </div>
      </div>
    </section>

    <!-- Ergebnis -->
    <section id="ansicht-ergebnis" class="ansicht ansicht-ergebnis" aria-labelledby="titel-ergebnis" hidden>
      <h1 id="titel-ergebnis" class="titel" tabindex="-1">Geschafft!</h1>
      <div class="tier-zeile tier-zeile-gross">
        <div class="tier-mittel" id="ergebnis-tier"></div>
        <div class="sprechblase"><p id="ergebnis-spruch"></p></div>
      </div>
      <dl class="ergebnis-liste" id="ergebnis-liste"></dl>
      <div class="neues-tier" id="neues-tier" hidden></div>
      <section class="rekord-name" id="rekord-name" aria-labelledby="titel-rekord-name" hidden>
        <h2 id="titel-rekord-name" tabindex="-1">Wer hat gespielt?</h2>
        <p class="rekord-name-info" id="rekord-name-info"></p>
        <div class="namen-schnellwahl" id="namen-schnellwahl" role="group" aria-label="Zuletzt benutzte Namen"></div>
        <form class="name-formular" id="name-formular">
          <label for="name-eingabe">Name</label>
          <div class="name-zeile">
            <input type="text" id="name-eingabe" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
            <button type="submit" class="knopf knopf-haupt">Eintragen</button>
          </div>
        </form>
        <button type="button" class="knopf knopf-neben knopf-ohne-name" id="knopf-ohne-name">Ohne Namen</button>
        <p class="rekord-name-fertig" id="rekord-name-fertig" role="status"></p>
      </section>
      <div class="knopf-reihe">
        <button type="button" class="knopf knopf-haupt" id="knopf-nochmal">Noch eine Runde</button>
        <button type="button" class="knopf knopf-neben" id="knopf-ergebnis-start">Zur Startseite</button>
      </div>
    </section>

    <!-- Meine Tiere -->
    <section id="ansicht-tiere" class="ansicht ansicht-tiere" aria-labelledby="titel-tiere" hidden>
      <header class="seiten-kopf">
        <button type="button" class="knopf knopf-klein knopf-zurueck" aria-label="Zurück zur Startseite">
          <span aria-hidden="true">←</span> Zurück
        </button>
        <h1 id="titel-tiere" class="titel" tabindex="-1">Meine Tiere</h1>
      </header>
      <p class="sterne-gesamt" id="tiere-sterne"></p>
      <p class="naechstes-tier" id="tiere-naechstes"></p>
      <ul class="tier-liste" id="tier-liste"></ul>
    </section>

    <!-- Einstellungen -->
    <section id="ansicht-einstellungen" class="ansicht ansicht-einstellungen" aria-labelledby="titel-einstellungen" hidden>
      <header class="seiten-kopf">
        <button type="button" class="knopf knopf-klein knopf-zurueck" aria-label="Zurück zur Startseite">
          <span aria-hidden="true">←</span> Zurück
        </button>
        <h1 id="titel-einstellungen" class="titel" tabindex="-1">Einstellungen</h1>
      </header>
      <form class="einstellungen" id="einstellungen-formular"></form>
    </section>

    <!-- Rekorde -->
    <section id="ansicht-rekorde" class="ansicht ansicht-rekorde" aria-labelledby="titel-rekorde" hidden>
      <header class="seiten-kopf">
        <button type="button" class="knopf knopf-klein knopf-zurueck" aria-label="Zurück zur Startseite">
          <span aria-hidden="true">←</span> Zurück
        </button>
        <h1 id="titel-rekorde" class="titel" tabindex="-1">Rekorde</h1>
      </header>
      <div id="rekorde-inhalt"></div>
    </section>

  </main>

  <script src="js/noten-konfiguration.js"></script>
  <script src="js/noten.js"></script>
  <script src="js/spiel-logik.js"></script>
  <script src="js/notensystem.js"></script>
  <script src="js/tiere.js"></script>
  <script src="js/modi.js"></script>
  <!-- Spielmodi: je Modus eine Datei, vor js/app.js -->
  <script src="js/modi/klassisch.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
